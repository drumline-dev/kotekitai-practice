<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b5fab">
<title>鼓笛隊れんしゅう</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 合言葉の画面 -->
<section id="login" class="screen center" hidden>
  <form id="loginForm" class="card">
    <h1>🥁 鼓笛隊れんしゅう</h1>
    <p>合言葉を入れてね</p>
    <!-- 日本語の合言葉を入力できるよう type="text" にしている（password だと日本語入力ができない端末がある） -->
    <input id="pass" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉">
    <button type="submit" class="primary">はじめる</button>
    <p id="loginError" class="error" aria-live="polite"></p>
  </form>
</section>

<!-- 曲えらびの画面 -->
<section id="songs" class="screen center" hidden>
  <div class="card wide">
    <h1>曲をえらんでね</h1>
    <ul id="songList" class="song-list"></ul>
  </div>
</section>

<!-- 練習の画面 -->
<section id="practice" class="screen" hidden>
  <!-- 打楽器のときだけ出る、左の縦ならびのボタン（中身は下のボタンと同じ働き） -->
  <nav id="sidebar" class="sidebar" aria-label="そうさ">
    <button id="sbBack" type="button" aria-label="曲えらびにもどる">◀</button>
    <button id="sbRewind" type="button" aria-label="さいしょへ">⏮</button>
    <button id="sbPlay" type="button" class="primary" aria-label="さいせい">▶</button>
    <div class="sb-bpm">
      <button id="sbBpmUp" type="button" aria-label="はやくする">＋</button>
      <span id="sbBpm">♩100</span>
      <button id="sbBpmDown" type="button" aria-label="おそくする">－</button>
    </div>
    <button id="sbLoop" type="button" class="toggle" aria-pressed="false" aria-label="くり返し">🔁</button>
    <button id="sbSettings" type="button" aria-label="せってい">⚙</button>
    <span id="sbMeasure" class="sb-measure"></span>
  </nav>

  <header class="topbar">
    <button id="backBtn" type="button">◀ 曲</button>
    <h2 id="songTitle"></h2>
    <select id="partSelect" aria-label="パート"></select>
    <button id="settingsBtn" type="button" aria-label="せってい">⚙ せってい</button>
  </header>

  <div id="scoreWrap"><div id="score"></div></div>

  <div class="controls">
    <button id="rewindBtn" type="button" aria-label="さいしょへ">⏮</button>
    <button id="playBtn" type="button" class="primary play" aria-label="さいせい">▶</button>
    <select id="startSelect" aria-label="演奏を始める場所"></select>
    <div class="bpm" role="group" aria-label="はやさ">
      <span class="bpm-note">♩=</span>
      <button id="bpmDown" type="button" aria-label="おそくする">－</button>
      <input id="bpm" type="number" inputmode="numeric" min="30" max="240" step="1" value="100" aria-label="BPM">
      <button id="bpmUp" type="button" aria-label="はやくする">＋</button>
      <button id="bpmOrig" type="button" class="link" title="楽譜のはやさにもどす"></button>
    </div>
    <button id="loopBtn" type="button" class="toggle" aria-pressed="false">🔁 くり返し</button>
    <span id="measureLabel" class="measure"></span>
  </div>

  <div id="keyboard" aria-label="けんばん"></div>
  <div id="pads" aria-label="たいこ" hidden></div>

  <div id="settings" class="panel" hidden>
    <div class="panel-body">
      <h3>せってい</h3>
      <!-- 打楽器のときは、パートと始める場所の選択をここに移す -->
      <div id="percRows" hidden>
        <div class="row">パート：<span id="partSlot"></span></div>
        <div class="row">始める場所：<span id="startSlot"></span></div>
      </div>
      <fieldset>
        <legend>鳴らす音</legend>
        <label><input type="radio" name="mode" value="own" checked> <span id="modeOwnLabel">お手本（自分のパートだけ）</span></label>
        <label><input type="radio" name="mode" value="all"> 全体の演奏</label>
        <label><input type="radio" name="mode" value="accomp"> 伴奏だけ（自分のパートは鳴らさない）</label>
      </fieldset>
      <label class="row"><input id="metronome" type="checkbox"> メトロノームを鳴らす</label>
      <div class="row">くり返す範囲：
        <select id="loopFrom"></select> 小節目から
        <select id="loopTo"></select> 小節目まで
      </div>
      <label class="row doremi-row"><input id="doremi" type="checkbox"> 鍵盤に「ドレミ」を表示する</label>
      <div class="row">楽譜の大きさ：
        <button id="zoomOut" type="button">－</button>
        <button id="zoomIn" type="button">＋</button>
      </div>
      <button id="settingsClose" type="button" class="primary">とじる</button>
    </div>
  </div>

  <div id="rotate">📱↻<br>スマホを横向きにしてね</div>
</section>

<!-- 太鼓の絵に使う色（グラデーション） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-head" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f2f0ea"/><stop offset="1" stop-color="#d8d4cc"/>
    </radialGradient>
    <linearGradient id="g-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/><stop offset=".3" stop-color="#9aa1aa"/><stop offset=".5" stop-color="#eef1f4"/>
      <stop offset=".72" stop-color="#7b828b"/><stop offset="1" stop-color="#d9dde2"/>
    </linearGradient>
    <linearGradient id="g-hoop-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6fb3"/><stop offset=".45" stop-color="#1d3566"/><stop offset=".55" stop-color="#3a5d9e"/><stop offset="1" stop-color="#14264a"/>
    </linearGradient>
    <radialGradient id="g-bronze" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f8e39a"/><stop offset=".55" stop-color="#d6a844"/><stop offset="1" stop-color="#a5771d"/>
    </radialGradient>
    <radialGradient id="g-bell" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fbeab0"/><stop offset="1" stop-color="#c39431"/>
    </radialGradient>
  </defs>
</svg>

<div id="loading" class="loading" hidden>よみこみ中…</div>
<p id="fatal" class="fatal" hidden></p>

<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<script src="app.js"></script>
</body>
</html>
